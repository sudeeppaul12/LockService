{% extends "base.html" %}
{% block title %}Add Vehicle — LockService{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <div class="form-card-header">
            <h2>Register a Vehicle</h2>
            <p>Enter your vehicle details below. All fields are required.</p>
        </div>

        <form method="POST" action="{{ url_for('add_vehicle_view') }}" novalidate>

            <div class="form-row">
                <div class="form-group">
                    <label for="make">Make <span class="required">*</span></label>
                    <input type="text" id="make" name="make"
                           value="{{ form_make or '' }}"
                           placeholder="e.g. Toyota"
                           required>
                </div>
                <div class="form-group">
                    <label for="model">Model <span class="required">*</span></label>
                    <input type="text" id="model" name="model"
                           value="{{ form_model or '' }}"
                           placeholder="e.g. Camry"
                           required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="year">Year <span class="required">*</span></label>
                    <input type="number" id="year" name="year"
                           value="{{ form_year or '' }}"
                           placeholder="e.g. 2020"
                           min="1900" max="2100"
                           required>
                </div>
                <div class="form-group">
                    <label for="vin">VIN <span class="required">*</span></label>
                    <input type="text" id="vin" name="vin"
                           value="{{ form_vin or '' }}"
                           placeholder="17-character vehicle ID"
                           required>
                    <span class="field-hint">Found on your registration or inside the driver's door.</span>
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('customer_dashboard') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Vehicle</button>
            </div>

        </form>
    </div>
</div>
{% endblock %}
